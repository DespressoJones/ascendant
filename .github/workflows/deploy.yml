name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            quebec-adoption/package-lock.json
      - run: npm ci
      - run: npm run build
      # Le fil rouge (Québec adoption guide) ships alongside the app at /ascendant/quebec-adoption/
      - run: npm ci
        working-directory: quebec-adoption
      - run: npm run build
        working-directory: quebec-adoption
      - run: cp -r quebec-adoption/dist dist/quebec-adoption
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
